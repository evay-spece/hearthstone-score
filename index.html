<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="炉石记分">
<link rel="manifest" href="manifest.json">
<title>炉石双人记分 v1.1.3</title>
<style>
:root{
  --bg:#0b1220;--panel:#111827;--card:#172033;--border:#334155;
  --text:#f8fafc;--muted:#94a3b8;--accent:#0a84ff;--accentbg:#102a56;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px)}
.top{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scorecard{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:6px 8px;text-align:center}
.avatar{font-size:26px;line-height:1}
.score{font-size:30px;font-weight:400;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.col{display:flex;flex-direction:column;gap:5px;min-width:0}
.choice{
  min-height:38px;width:100%;border-radius:11px;border:1.2px solid var(--border);
  background:var(--panel);color:var(--text);padding:6px 7px;text-align:left;
  font-size:12.5px;font-weight:400;line-height:1.1;
}
.choice.selected{border-color:var(--accent);background:var(--accentbg);box-shadow:inset 0 0 0 1px var(--accent)}
.choice.system{opacity:.95}
.preview,.history,.share{margin-top:6px;border:1px solid var(--border);background:var(--panel);border-radius:13px;padding:9px}
.resultline{font-size:15px;font-weight:400;line-height:1.42;word-break:break-all}
.primary{
  width:100%;min-height:42px;margin-top:7px;border:0;border-radius:12px;
  background:var(--accent);color:white;font-size:15px;font-weight:400;
}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.secondary{min-height:38px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);font-size:12px;font-weight:400}
.muted{font-size:11px;color:var(--muted)}
.sharebox{white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;font-size:14px;font-weight:400;line-height:1.35}
.shareactions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.hidden{display:none}
.history-item{padding-top:7px;margin-top:7px;border-top:1px solid var(--border);font-size:12px;line-height:1.35}
.history-item:first-child{padding-top:0;margin-top:0;border-top:0}
.history-item strong{font-weight:400}
button:active{transform:scale(.985)}
details summary{list-style:none;cursor:pointer;font-weight:400;font-size:12px}
details summary::-webkit-details-marker{display:none}
.fold-head{display:flex;justify-content:space-between;align-items:center}
.fold-tag{font-size:11px;color:var(--muted)}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media (orientation:landscape) and (max-height:500px){
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  main{
    width:100%;
    max-width:none;
    height:100dvh;
    margin:0;
    padding-top:max(5px,env(safe-area-inset-top));
    padding-bottom:max(5px,env(safe-area-inset-bottom));
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right));
    display:grid;
    grid-template-columns:minmax(165px,1fr) minmax(165px,1fr) minmax(285px,1.5fr);
    grid-template-rows:68px 1fr auto auto;
    grid-template-areas:
      "scoreA scoreB result"
      "opsA   opsB   result"
      "opsA   opsB   tools"
      "opsA   opsB   hist";
    gap:6px;
    overflow:hidden;
  }

  /* 拆开原来的双分数卡和双操作区，让它们直接进入横屏主网格 */
  .top,.grid{display:contents}

  .top .scorecard:nth-child(1){grid-area:scoreA}
  .top .scorecard:nth-child(2){grid-area:scoreB}
  #colA{grid-area:opsA}
  #colB{grid-area:opsB}

  .scorecard{
    margin:0;
    padding:5px 8px;
    border-radius:13px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .avatar{font-size:25px}
  .score{font-size:31px;margin-top:2px}

  .col{
    gap:4px;
    min-height:0;
    justify-content:space-between;
  }
  .choice{
    min-height:0;
    height:calc((100% - 24px) / 7);
    padding:4px 8px;
    border-radius:9px;
    font-size:11.5px;
    line-height:1.05;
    display:flex;
    align-items:center;
  }

  .preview{
    grid-area:result;
    margin:0;
    padding:10px 10px 9px;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    min-height:0;
  }
  #preview{
    min-height:66px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:2px 2px 5px;
  }
  .resultline{
    font-size:15px;
    line-height:1.38;
    font-weight:400;
  }
  .primary{
    min-height:54px;
    margin-top:7px;
    border-radius:13px;
    font-size:17px;
  }

  .toolbar{
    grid-area:tools;
    margin:0;
    gap:5px;
  }
  .secondary{
    min-height:42px;
    border-radius:11px;
    font-size:11px;
    padding:3px 4px;
  }

  .history{
    grid-area:hist;
    margin:0;
    padding:0;
    border-radius:13px;
    overflow:hidden;
    align-self:end;
  }
  .history summary{
    min-height:44px;
    padding:0 10px;
    display:flex;
    align-items:center;
  }
  .history[open]{
    max-height:118px;
    overflow:auto;
    padding-bottom:7px;
  }
  .history[open] #history{
    padding:0 9px 7px;
    margin-top:0 !important;
  }

  /* 横屏按截图隐藏“最近一次结算”，当前结果直接看上面的结算卡 */
  #share{display:none !important}

  /* 修改比分时在右侧覆盖显示，不挤乱两边操作区 */
  #scoreEditor{
    grid-area:result;
    z-index:10;
    margin:0;
    align-self:start;
    max-height:100%;
    overflow:auto;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }

  .shareactions{gap:5px;margin-top:5px}
  .muted{font-size:10px}
}

.version-badge{
  position:fixed;
  right:max(8px,env(safe-area-inset-right));
  bottom:max(6px,env(safe-area-inset-bottom));
  z-index:50;
  font-size:10px;
  line-height:1;
  color:var(--muted);
  opacity:.72;
  pointer-events:none;
  font-variant-numeric:tabular-nums;
}
@media (orientation:landscape) and (max-height:500px){
  .version-badge{
    right:max(10px,env(safe-area-inset-right));
    bottom:max(5px,env(safe-area-inset-bottom));
    font-size:9px;
    opacity:.66;
  }
}


html[data-theme="light"]{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --card:#eef2f6;
  --border:#cbd5e1;
  --text:#111827;
  --muted:#64748b;
  --accent:#007aff;
  --accentbg:#e7f1ff;
}
.theme-toggle{
  position:fixed;
  top:max(7px,env(safe-area-inset-top));
  right:max(8px,env(safe-area-inset-right));
  z-index:60;
  width:34px;
  height:34px;
  padding:0;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  font-size:17px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
@media (orientation:landscape) and (max-height:500px){
  .theme-toggle{
    top:max(5px,env(safe-area-inset-top));
    right:max(10px,env(safe-area-inset-right));
    width:30px;
    height:30px;
    font-size:15px;
  }
}


.orientation-toggle{
  position:fixed;
  top:max(7px,env(safe-area-inset-top));
  right:max(48px,calc(env(safe-area-inset-right) + 40px));
  z-index:60;
  min-width:44px;
  height:34px;
  padding:0 8px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  font-size:14px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
@media (orientation:landscape) and (max-height:500px){
  .orientation-toggle{
    top:max(5px,env(safe-area-inset-top));
    right:max(46px,calc(env(safe-area-inset-right) + 38px));
    height:30px;
    min-width:40px;
    padding:0 7px;
    font-size:12px;
  }
}

</style>
</head>
<body>
<main>
<section class="top">
  <div class="scorecard"><div class="avatar">🐸</div><div id="scoreA" class="score">-4</div></div>
  <div class="scorecard"><div class="avatar">🐤</div><div id="scoreB" class="score">8</div></div>
</section>

<section class="grid">
  <div class="col" id="colA">
    <button type="button" class="choice" data-player="0" data-action="win">🐔 吃鸡 +1</button>
    <button type="button" class="choice system" data-player="0" data-action="comeback">🚀 落后加分 +1</button>
    <button type="button" class="choice" data-player="0" data-action="doubleWin">2️⃣ 双倍成功 +1</button>
    <button type="button" class="choice" data-player="0" data-action="doubleFail">8️⃣ 双倍失败 -2</button>
    <button type="button" class="choice" data-player="0" data-action="duel">⚔️ 发起决斗</button>
    <button type="button" class="choice" data-player="0" data-action="kill">🪓 打死对面</button>
    <button type="button" class="choice" data-player="0" data-action="finalKill">🪓🪓 决赛打死</button>
  </div>
  <div class="col" id="colB">
    <button type="button" class="choice" data-player="1" data-action="win">🐔 吃鸡 +1</button>
    <button type="button" class="choice system" data-player="1" data-action="comeback">🚀 落后加分 +1</button>
    <button type="button" class="choice" data-player="1" data-action="doubleWin">2️⃣ 双倍成功 +1</button>
    <button type="button" class="choice" data-player="1" data-action="doubleFail">8️⃣ 双倍失败 -2</button>
    <button type="button" class="choice" data-player="1" data-action="duel">⚔️ 发起决斗</button>
    <button type="button" class="choice" data-player="1" data-action="kill">🪓 打死对面</button>
    <button type="button" class="choice" data-player="1" data-action="finalKill">🪓🪓 决赛打死</button>
  </div>
</section>

<section class="preview">
  <div id="preview"><span class="muted">点选本局情况后，这里会显示结算。</span></div>
  <button id="confirm" class="primary">确认并复制</button>
</section>



<details id="share" class="share hidden">
  <summary class="fold-head"><span>最近一次结算</span><span class="fold-tag">点开查看</span></summary>
  <div id="shareText" class="sharebox" style="margin-top:8px"></div>
  <div id="copyStatus" class="muted" style="margin-top:6px">已复制到剪贴板</div>
</details>

<section class="toolbar">
  <button id="clear" class="secondary">清空本局</button>
  <button id="undo" class="secondary">撤销上一局</button>
  <button id="editScore" class="secondary">修改比分</button>
</section>


<section id="scoreEditor" class="share hidden">
  <div style="font-weight:400;margin-bottom:6px;font-size:13px">手动修改当前比分</div>
  <div class="shareactions">
    <label style="display:block">
      <div class="muted" style="margin-bottom:4px">🐸 当前分数</div>
      <input id="editA" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
        style="width:100%;min-height:38px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);padding:8px 10px;font-size:16px;font-weight:400;text-align:center">
    </label>
    <label style="display:block">
      <div class="muted" style="margin-bottom:4px">🐤 当前分数</div>
      <input id="editB" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
        style="width:100%;min-height:38px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);padding:8px 10px;font-size:16px;font-weight:400;text-align:center">
    </label>
  </div>
  <div class="shareactions">
    <button id="saveScoreEdit" class="secondary">确认修改</button>
    <button id="cancelScoreEdit" class="secondary">取消</button>
  </div>
  <div class="muted" style="margin-top:8px">只修改当前总分；之前的比赛记录会保留。</div>
</section>

<details class="history">
  <summary class="fold-head"><span>比赛记录</span><span class="fold-tag">默认收起</span></summary>
  <div id="history" style="margin-top:8px"></div>
</details>
</main>
<button id="orientationToggle" class="orientation-toggle" type="button" aria-label="切换横竖屏">横屏</button>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="切换浅色深色模式">☀️</button>
<div class="version-badge">v1.1.3</div>

<script>
(() => {
 const BASE=[-4,8], KEY="hs-duo-score-ios-v2", THEME_KEY="hs-duo-theme", ORIENTATION_KEY="hs-duo-orientation";
 const themeMeta=document.querySelector('meta[name="theme-color"]');
 function applyTheme(theme){
   document.documentElement.dataset.theme=theme;
   const btn=document.getElementById("themeToggle");
   if(btn){
     btn.textContent=theme==="light"?"🌙":"☀️";
     btn.setAttribute("aria-label",theme==="light"?"切换到深色模式":"切换到浅色模式");
   }
   if(themeMeta) themeMeta.setAttribute("content",theme==="light"?"#f4f6f8":"#0b1220");
 }
 let savedTheme="dark";
 try{
   const t=localStorage.getItem(THEME_KEY);
   if(t==="light"||t==="dark") savedTheme=t;
 }catch(e){}
 applyTheme(savedTheme);
 document.getElementById("themeToggle").addEventListener("click",()=>{
   const next=document.documentElement.dataset.theme==="light"?"dark":"light";
   applyTheme(next);
   try{localStorage.setItem(THEME_KEY,next)}catch(e){}
 });

 async function requestOrientation(mode){
   const btn=document.getElementById("orientationToggle");
   if(btn) btn.textContent=mode==="landscape"?"横屏":"竖屏";
   try{localStorage.setItem(ORIENTATION_KEY,mode)}catch(e){}

   // 支持 Screen Orientation API 的浏览器 / 已安装 PWA 会真正尝试旋转屏幕。
   try{
     if(screen.orientation && screen.orientation.lock){
       await screen.orientation.lock(mode==="landscape"?"landscape":"portrait");
     }
   }catch(e){
     // iOS Safari 某些版本不允许网页主动锁定方向，按钮仍保留偏好状态。
   }
 }

 let orientationMode="landscape";
 try{
   const savedOrientation=localStorage.getItem(ORIENTATION_KEY);
   if(savedOrientation==="portrait"||savedOrientation==="landscape"){
     orientationMode=savedOrientation;
   }
 }catch(e){}
 requestOrientation(orientationMode);

 document.getElementById("orientationToggle").addEventListener("click",async()=>{
   orientationMode=orientationMode==="landscape"?"portrait":"landscape";
   await requestOrientation(orientationMode);
 });

 const defs=[
  ["win","🐔 吃鸡 +1"],
  ["comeback","🚀 落后加分 +1"],
  ["doubleWin","2️⃣ 双倍成功 +1"],
  ["doubleFail","8️⃣ 双倍失败 -2"],
  ["duel","⚔️ 发起决斗"],
  ["kill","🪓 打死对面"],
  ["finalKill","🪓🪓 决赛打死"]
 ];
 let s={scores:BASE.slice(),history:[],selected:[{},{}],lastMessage:""};

 function load(){
   try{
     const old=localStorage.getItem(KEY);
     if(old){const x=JSON.parse(old); if(x&&Array.isArray(x.scores)) s={...s,...x};}
   }catch(e){}
 }
 function save(){localStorage.setItem(KEY,JSON.stringify(s))}
 function on(p,a){return !!s.selected[p][a]}
 function setOn(p,a,v){s.selected[p][a]=!!v}
 function winner(){if(on(0,"win"))return 0;if(on(1,"win"))return 1;return null}
 function signed(n){return (n>=0?"+":"")+n}
 function resultText(emoji,delta,score){return delta===0?`=${score}`:`${emoji||"—"}　${signed(delta)}=${score}`}
 function hasSelection(){
   return [0,1].some(p=>Object.entries(s.selected[p]||{}).some(([k,v])=>k!=="comeback"&&v));
 }
 function syncComeback(){
   for(let p=0;p<2;p++){
     const o=p?0:1;
     setOn(p,"comeback",on(p,"win")&&s.scores[p]<s.scores[o]);
   }
 }
 function applyRules(p,a,next){
   if(a==="comeback")return;
   const o=p?0:1;
   setOn(p,a,next);

   if(a==="win"&&next){
     setOn(p,"doubleFail",false);
     setOn(o,"win",false);
     setOn(o,"doubleWin",false);
     setOn(o,"finalKill",false);
   }
   if(a==="win"&&!next){
     setOn(p,"doubleWin",false);
     setOn(p,"finalKill",false);
   }
   if(a==="doubleWin"&&next){
     setOn(p,"win",true);
     setOn(p,"doubleFail",false);
     setOn(o,"win",false);
     setOn(o,"doubleWin",false);
     setOn(o,"finalKill",false);
   }
   if(a==="doubleFail"&&next){
     setOn(p,"win",false);
     setOn(p,"doubleWin",false);
     setOn(p,"finalKill",false);
   }
   if(a==="kill"&&next){
     setOn(p,"finalKill",false);
     setOn(o,"kill",false);
     setOn(o,"finalKill",false);
     setOn(o,"win",false);
     setOn(o,"doubleWin",false);
   }
   if(a==="finalKill"&&next){
     setOn(p,"kill",false);
     setOn(p,"doubleFail",false);
     setOn(p,"win",true);
     setOn(o,"win",false);
     setOn(o,"doubleWin",false);
     setOn(o,"doubleFail",false);
     setOn(o,"kill",false);
     setOn(o,"finalKill",false);
   }
   syncComeback(); save(); render();
 }
 function calc(){
   syncComeback();
   const delta=[0,0],emoji=["",""];
   for(let p=0;p<2;p++){
     if(on(p,"win")){delta[p]+=1;emoji[p]+="🐔"}
     if(on(p,"comeback")){delta[p]+=1;emoji[p]+="🚀"}
     if(on(p,"doubleWin")){delta[p]+=1;emoji[p]+="2️⃣"}
     if(on(p,"doubleFail")){delta[p]-=2;emoji[p]+="8️⃣"}
   }
   for(let p=0;p<2;p++){
     const o=p?0:1;
     if(on(p,"kill")){delta[p]+=1;delta[o]-=1;emoji[p]+="🪓";emoji[o]+="☠️"}
     if(on(p,"finalKill")){delta[p]+=2;delta[o]-=2;emoji[p]+="🪓🪓";emoji[o]+="☠️☠️"}
   }
   const w=winner();
   const dc=(on(0,"duel")?1:0)+(on(1,"duel")?1:0);
   if(w!==null&&dc>0){
     const o=w?0:1;
     delta[w]+=dc;delta[o]-=dc;
     emoji[w]+="⚔️".repeat(dc);
     emoji[o]+="☠️".repeat(dc);
   }
   return {delta,emoji};
 }
 function buildButtons(){
   document.querySelectorAll(".choice[data-player][data-action]").forEach(b=>{
     const p=+b.dataset.player,a=b.dataset.action;
     b.classList.toggle("selected",on(p,a));
     b.setAttribute("aria-pressed",on(p,a)?"true":"false");
     if(!b.dataset.bound){
       b.dataset.bound="1";
       b.addEventListener("click",()=>applyRules(p,a,!on(p,a)));
     }
   });
 }
 function render(){
   syncComeback();
   document.getElementById("scoreA").textContent=s.scores[0];
   document.getElementById("scoreB").textContent=s.scores[1];
   buildButtons();

   const c=calc(), pv=document.getElementById("preview");
   if(!hasSelection()){
     pv.innerHTML='<span class="muted">点选本局情况后，这里会显示结算。</span>';
   }else{
     const after=[s.scores[0]+c.delta[0],s.scores[1]+c.delta[1]];
     pv.innerHTML=
       `<div class="resultline">🐸：${resultText(c.emoji[0],c.delta[0],after[0])}</div>`+
       `<div class="resultline">🐤：${resultText(c.emoji[1],c.delta[1],after[1])}</div>`;
   }

   const share=document.getElementById("share");
   if(s.lastMessage){
     share.classList.remove("hidden");
     document.getElementById("shareText").textContent=s.lastMessage;
   }else{
     share.classList.add("hidden");
     share.removeAttribute("open");
   }

   let html='<div class="history-item"><strong>历史分数</strong>　🐸 -4 ｜ 🐤 8</div>';
   s.history.slice().reverse().forEach((x,i)=>{
     const n=s.history.length-i;
     html+=`<div class="history-item"><strong>第${n}局</strong>
       <div>🐸：${resultText(x.emoji[0],x.delta[0],x.after[0])}</div>
       <div>🐤：${resultText(x.emoji[1],x.delta[1],x.after[1])}</div>
     </div>`;
   });
   document.getElementById("history").innerHTML=html;
   save();
 }
 document.getElementById("confirm").addEventListener("click",async()=>{
   if(!hasSelection())return;
   const c=calc(), before=s.scores.slice();
   const after=[before[0]+c.delta[0],before[1]+c.delta[1]];
   const msg=`🐸：${resultText(c.emoji[0],c.delta[0],after[0])}
🐤：${resultText(c.emoji[1],c.delta[1],after[1])}`;
   s.scores=after.slice();
   s.history.push({before,after:after.slice(),delta:c.delta.slice(),emoji:c.emoji.slice(),message:msg});
   s.lastMessage=msg;
   s.selected=[{},{}];
   save();render();

   const status=document.getElementById("copyStatus");
   try{
     await navigator.clipboard.writeText(msg);
     if(status) status.textContent="已复制到剪贴板";
   }catch(e){
     if(status) status.textContent="复制失败，请长按上方结果复制";
   }
 });
 document.getElementById("clear").addEventListener("click",()=>{s.selected=[{},{}];save();render()});
 document.getElementById("undo").addEventListener("click",()=>{
   const x=s.history.pop();if(!x)return;
   s.scores=x.before.slice();
   s.lastMessage=s.history.length?s.history[s.history.length-1].message:"";
   save();render();
 });
 const scoreEditor=document.getElementById("scoreEditor");
 document.getElementById("editScore").addEventListener("click",()=>{
   document.getElementById("editA").value=s.scores[0];
   document.getElementById("editB").value=s.scores[1];
   scoreEditor.classList.remove("hidden");
   setTimeout(()=>document.getElementById("editA").focus(),50);
 });
 document.getElementById("cancelScoreEdit").addEventListener("click",()=>{
   scoreEditor.classList.add("hidden");
 });
 document.getElementById("saveScoreEdit").addEventListener("click",()=>{
   const rawA=document.getElementById("editA").value.trim();
   const rawB=document.getElementById("editB").value.trim();
   if(!/^-?\d+$/.test(rawA)||!/^-?\d+$/.test(rawB)) return;
   const a=parseInt(rawA,10), b=parseInt(rawB,10);
   s.scores=[a,b];
   s.selected=[{},{}];
   scoreEditor.classList.add("hidden");
   save();render();
 });

 if("serviceWorker" in navigator){
   window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
 }
 load();render();
})();
</script>
</body>
</html>
